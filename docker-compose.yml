version: '3.8'

services:
  app:
    image: chat-turbo:latest
    env_file:
      - .env
    networks:
      - traefik-public
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Chat Turbo}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://app.assessoriaturbodigital.com.br}
      - NEXT_PUBLIC_UAZAPI_URL=${NEXT_PUBLIC_UAZAPI_URL}
      - NEXT_PUBLIC_SERVER_ID=${NEXT_PUBLIC_SERVER_ID}
      - NEXT_PUBLIC_SUPORTE_URL=${NEXT_PUBLIC_SUPORTE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - UAZAPI_ADMIN_TOKEN=${UAZAPI_ADMIN_TOKEN}
      - N8N_REDIS_WEBHOOK_URL=${N8N_REDIS_WEBHOOK_URL}
      - N8N_IA_ASSISTENT_WEBHOOK_URL=${N8N_IA_ASSISTENT_WEBHOOK_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_API_URL=${ASAAS_API_URL}
      - ASAAS_WEBHOOK_SECRET=${ASAAS_WEBHOOK_SECRET}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - "traefik.enable=true"
        # Roteamento HTTP (Redirecionamento para HTTPS)
        - "traefik.http.routers.chat-turbo-http.rule=Host(`app.assessoriaturbodigital.com.br`)"
        - "traefik.http.routers.chat-turbo-http.entrypoints=web"
        - "traefik.http.routers.chat-turbo-http.middlewares=chat-turbo-https-redirect"
        - "traefik.http.middlewares.chat-turbo-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.chat-turbo-https-redirect.redirectscheme.permanent=true"

        # Roteamento HTTPS com Certificado SSL automático
        - "traefik.http.routers.chat-turbo.rule=Host(`app.assessoriaturbodigital.com.br`)"
        - "traefik.http.routers.chat-turbo.entrypoints=websecure"
        - "traefik.http.routers.chat-turbo.tls=true"
        - "traefik.http.routers.chat-turbo.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"

        # Porta interna do container Next.js
        - "traefik.http.services.chat-turbo.loadbalancer.server.port=3000"

networks:
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}
