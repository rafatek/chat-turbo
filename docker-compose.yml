services:
  chat-turbo:
    image: chat-turbo:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Chat Turbo}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_UAZAPI_URL: ${NEXT_PUBLIC_UAZAPI_URL}
        NEXT_PUBLIC_SERVER_ID: ${NEXT_PUBLIC_SERVER_ID}
        NEXT_PUBLIC_SUPORTE_URL: ${NEXT_PUBLIC_SUPORTE_URL}
    ports:
      - "${PORT:-3000}:3000"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Chat Turbo}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_UAZAPI_URL=${NEXT_PUBLIC_UAZAPI_URL}
      - NEXT_PUBLIC_SERVER_ID=${NEXT_PUBLIC_SERVER_ID}
      - NEXT_PUBLIC_SUPORTE_URL=${NEXT_PUBLIC_SUPORTE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - UAZAPI_ADMIN_TOKEN=${UAZAPI_ADMIN_TOKEN}
      - N8N_REDIS_WEBHOOK_URL=${N8N_REDIS_WEBHOOK_URL}
      - N8N_IA_ASSISTENT_WEBHOOK_URL=${N8N_IA_ASSISTENT_WEBHOOK_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_API_URL=${ASAAS_API_URL}
      - ASAAS_WEBHOOK_SECRET=${ASAAS_WEBHOOK_SECRET}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
